  services:
    database:
      image: postgres
      container_name: postgres_db
      environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: ${DB_NAME}
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql

    api:
      build: .
      container_name: leasity-hw
      ports:
        - "8080:8080"
      environment:
        DB_HOST: database
        DB_PORT: 5432
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_NAME: ${DB_NAME}

  volumes:
    postgres_data:
